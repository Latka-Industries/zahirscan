# Pre-commit hooks for Rust project
# Install: pip install pre-commit (or mise install pre-commit)
# Setup: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-json
        exclude: |
          (?x)^(
            \.vscode/.*\.json$
          )$
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  # Rust formatting and linting
  - repo: local
    hooks:
      - id: rustfmt
        name: rustfmt
        entry: bash -c 'cargo fmt --check'
        language: system
        files: \.rs$
        pass_filenames: false
      - id: clippy
        name: clippy
        entry: bash -c 'cargo clippy --manifest-path=Cargo.toml -- -D warnings'
        language: system
        files: \.rs$
        pass_filenames: false
        stages: [manual] # Run manually to avoid slow commits

  # Commit message validation - enforces conventional commit format
  # This checks for formats like: "feat: add parser", "fix #123: bug", etc.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.3.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--strict]
