[package]
name = "zahirscan"
version = "0.3.5"
edition = "2024"
rust-version = "1.95"
authors = ["AHurowitz <latkaindustries@gmail.com>"]
description = "Token-efficient content compression for AI analysis using probabilistic template mining"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Latka-Industries/zahirscan"
homepage = "https://ublx.dev/zahirscan/"
documentation = "https://docs.rs/zahirscan"
readme = "README.md"
keywords = ["parser", "template-mining", "compression", "metadata", "cli"]
categories = [
  "command-line-utilities",
  "development-tools",
  "parsing",
  "text-processing",
  "multimedia",
]

[lib]
name = "zahirscan"
path = "src/lib.rs"

[[bin]]
name = "zahirscan"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
apache-avro = { version = "0.21.0", features = ["snappy"] }
arrow-array = "58.2.0"
arrow-cast = { version = "58.2.0", default-features = false }
arrow-ipc = "58.2.0"
arrow-schema = "58.2.0"
bytes = "1.10.1"
calamine = "0.35.0"
chrono = { version = "0.4.43", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
colored = "3.1.1"
csv = "1.4.0"
dashmap = "6.1.0"
env_logger = "0.11.8"
ffprobe = "0.4.0"
flatbuffers = "25.12.19"
gguf-rs = "0.1.7"
hdf5-pure-rust = "0.3.2"
image = "0.25.10"
kdam = "0.6.4"
linguist = "0.1.6"
lofty = "0.24.0"
log = "0.4.29"
lopdf = "0.41.0"
matrix-market-rs = "0.1.3"
matrw = "0.1.4"
memmap2 = "0.9.9"
netcdf = { version = "0.12.0", optional = true }
num_cpus = "1.17.0"
onnx-ir = "0.21.0"
orc-rust = { version = "0.8.0", default-features = false }
oxionnx-proto = "0.1.2"
parquet = "58.2.0"
png = "0.18.0"
quick-xml = { version = "0.40.1", features = ["serialize"] }
rayon = "1.12.0"
regex = "1.12.2"
rlimit = "0.11"
rusqlite = { version = "0.39.0", features = ["bundled"] }
safetensors = "0.7.0"
scraper = "0.27.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_norway = "0.9.42"
tempfile = "3.27.0"
tetration = { version = "0.1.5", default-features = false }
toml = { version = "1.1.2", features = ["parse", "serde"] }
tract-tflite = "0.23.0"
zarrs = "0.23.10"
zarrs_filesystem = "0.3.9"
zip = "8.6.0"

[features]
# NetCDF is enabled by default; use `--no-default-features` (or `default = false` in dependents) when
# the system has no `libnetcdf` — a stub implementation is used instead of linking.
default = ["netcdf"]
netcdf = ["dep:netcdf"]

[package.metadata.docs.rs]
no-default-features = true
features = []

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
debug = false
overflow-checks = false

[dev-dependencies]
anyhow = "1.0.100"
criterion = { version = "0.8.1", features = ["html_reports"] }
rusqlite = { version = "0.39.0", features = ["bundled"] }
tempfile = "3.12.0"
