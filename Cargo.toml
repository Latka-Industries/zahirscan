[package]
name = "zahirscan"
version = "0.1.0"
edition = "2024"
authors = ["AHurowitz <thicclatka@users.noreply.github.com>"]
description = "Token-efficient content compression for AI analysis using probabilistic template mining"
license = "MIT OR Apache-2.0"
repository = "https://github.com/thicclatka/zahirscan"
keywords = [
  "log",
  "parser",
  "logs",
  "analysis",
  "cli",
  "token-reduction",
  "ai",
  "compression",
  "template-mining",
]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "zahirscan"
path = "src/lib.rs"

[[bin]]
name = "zahirscan"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
chrono = { version = "0.4.43", features = ["serde"] }
clap = { version = "4.5.54", features = ["derive"] }
dashmap = "6.1.0"
env_logger = "0.11.8"
lasso = "0.7.3"
log = "0.4.29"
memchr = "2.7.6"
memmap2 = "0.9.9"
num_cpus = "1.17.0"
rayon = "1.11.0"
regex = "1.12.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = { version = "0.9.11", features = ["parse", "serde"] }
image = "0.25"
png = "0.18.0"
tokio = { version = "1.49.0", features = ["rt", "rt-multi-thread"] }
ffprobe = "0.4.0"

[dev-dependencies]
anyhow = "1.0.100"
criterion = { version = "0.8.1", features = ["html_reports"] }
