[concurrency]
# Maximum number of parallel workers
# Defaults to num_cpus - 1 if not set or set to 0
# Chunking is now fully adaptive based on Phase 1 stats
max_workers = 0

# Byte thresholds for adaptive chunking multipliers
# Files below small_file_threshold_bytes use multiplier=1 (13 chunks for 13 workers)
# Files between thresholds use multiplier=2 (26 chunks)
# Files above large_file_threshold_bytes use multiplier=3 (39 chunks)
small_file_threshold_bytes = 100000  # 100 KB
large_file_threshold_bytes = 1000000 # 1 MB

# File batching threshold multiplier
# Batching kicks in when files > workers * threshold_multiplier
# This scales with available parallelism (e.g., 13 workers * 50 = 650 file threshold)
# Lower values = batching activates sooner, higher values = batching activates later
threshold_multiplier = 50

# Minimum collection size for chunking
# Collections smaller than this threshold will not be chunked (chunk_size = 1)
# This avoids overhead for small collections where parallelization isn't beneficial
min_collection_size_for_chunking = 1000

[mining]
# Core mining settings
# Static token threshold (0.0-1.0) - percentage of lines that must match for a token to be considered static
static_threshold = 0.8
# Text threshold (0.0-1.0) - fraction of sentences/tokens required for templates and n-grams (literary text has low repetition)
text_threshold = 0.01
# Maximum number of lines to sample when extracting examples
max_sample_lines = 100
# Maximum number of examples to collect per placeholder
max_examples_per_placeholder = 10
# N-gram settings for text parsing
min_ngram_size = 2
max_ngram_size = 4
# Minimum phrase length for text parsing
min_phrase_length = 3

[mining.tokens]
# Token estimation settings for compressed output size calculations
bytes_per_token = 4
json_overhead_tokens = 50
# Writing footprint token estimation
footprint_base_overhead_tokens = 20
footprint_svo_metrics_tokens = 10

[mining.entropy]
# Entropy calculation settings (for writing footprint analysis)
# Minimum number of matching sentences required to calculate entropy
min_entropy_sample_size = 5
# Minimum entropy value to display (below this, entropy is hidden)
min_entropy_display = 0.01
# Maximum entropy value to display (above this, entropy is hidden - likely from small samples)
max_entropy_display = 0.99
# Diversity ratio threshold for applying small sample correction
entropy_diversity_threshold = 0.95
# Sample size threshold for applying small sample correction
entropy_small_sample_threshold = 5
# Discount factor for small samples with high diversity
entropy_small_sample_discount = 0.85
# Maximum examples to use for entropy calculation
max_examples_for_entropy = 10

[mining.sentence]
# Sentence filtering settings (for text parsing)
# Minimum number of words required for a sentence to be processed
min_sentence_words = 2
# Alternative: if sentence has this many words, length requirement is relaxed
min_sentence_words_alt = 3
# Minimum character length for a sentence (unless it meets word count alternative)
min_sentence_length = 8
# Minimum examples per placeholder (used when calculating example limits)
min_examples_per_placeholder = 3
# Short prefix/suffix threshold (words) - below this, include in pattern; above, use placeholder
short_prefix_threshold = 3

[mining.pivot]
# Pivot point detection settings (for SVO analysis)
# Minimum variation score (different words following pivot) to be considered a pivot
min_pivot_variation = 2
# Maximum variation score - above this, word is too random to be structural
max_pivot_variation = 50
# Maximum number of common pivots to include in SVO analysis output
max_common_pivots = 10

[mining.file_types]
# File-type specific parsing settings
# Maximum length of paragraph text preview in examples (characters)
markdown_preview_length = 100
# Parquet / Arrow / Avro / ORC / .npy — base max rows for tabular sample (same default as CSV; column scaling applies)
max_tabular_sample_rows = 10000
# Tetration .tet: query concurrency follows [concurrency].max_workers and logical payload size
# (see README → Configuration → Tetration). Not capped by max_tabular_sample_rows.
# CSV only: base max rows for type inference + stats (scaled down for large files / many columns)
max_csv_scan_rows = 10000
# CSV only: cap distinct non-null strings per column for unique counts (memory bound)
max_csv_max_distinct_per_column = 500000
# Max decompressed bytes per ZIP member (DOCX/PPTX/XLSX/EPUB). 0 = no limit
max_zip_entry_uncompressed_bytes = 52428800

# File filtering: skip files before Phase 1
[filter]
ignore_patterns = [
  ".DS_Store",
  "Thumbs.db",
  "desktop.ini",
  "ehthumbs.db",
  "*.swp",
  "*.swo",
  "*.tmp",
  "*~",
  "~$*",
]
# Skip Unix hidden files (basename starts with .)
ignore_hidden_files = true
